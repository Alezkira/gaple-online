<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Gaple Online - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f3d2e 0%, #0a2b20 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(217, 164, 65, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #d9a441;
            margin-bottom: 5px;
        }

        .logo p {
            font-size: 14px;
            opacity: 0.7;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
        }

        .tab.active {
            background: #d9a441;
            color: #2b1c04;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d9a441;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: linear-gradient(160deg, #e8bc6a, #d9a441);
            color: #2b1c04;
            box-shadow: 0 4px 15px rgba(217, 164, 65, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 164, 65, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(192, 69, 58, 0.2);
            border: 1px solid rgba(192, 69, 58, 0.5);
            color: #ef9a9a;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #a5d6a7;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #d9a441;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>🁘 Gaple Online</h1>
                <p>Main gaple bareng teman-teman!</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="register">Register</button>
            </div>

            <div id="error" class="error"></div>
            <div id="success" class="success"></div>

            <!-- Login Form -->
            <div id="login-form" class="form-container active">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="Masukkan username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Masukkan password" autocomplete="current-password">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">Login</button>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-container">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="register-username" placeholder="3-20 karakter" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="register-password" placeholder="Minimal 4 karakter" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Konfirmasi Password</label>
                    <input type="password" id="register-confirm" placeholder="Ulangi password" autocomplete="new-password">
                </div>
                <button class="btn btn-primary" onclick="handleRegister()">Register</button>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Memproses...</p>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-form').classList.add('active');

                hideMessages();
            });
        });

        // Enter key support
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const form = input.closest('.form-container');
                    if (form.id === 'login-form') {
                        handleLogin();
                    } else {
                        handleRegister();
                    }
                }
            });
        });

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.classList.add('show');
            document.getElementById('success').classList.remove('show');
        }

        function showSuccess(msg) {
            const success = document.getElementById('success');
            success.textContent = msg;
            success.classList.add('show');
            document.getElementById('error').classList.remove('show');
        }

        function hideMessages() {
            document.getElementById('error').classList.remove('show');
            document.getElementById('success').classList.remove('show');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        async function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showError('Username & password wajib diisi');
                return;
            }

            showLoading(true);
            hideMessages();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('gaple_token', data.token);
                    localStorage.setItem('gaple_user', JSON.stringify(data.user));
                    showSuccess('Login berhasil! Mengalihkan...');
                    setTimeout(() => {
                        window.location.href = '/lobby.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Login gagal');
                }
            } catch (err) {
                showError('Koneksi gagal. Coba lagi.');
            } finally {
                showLoading(false);
            }
        }

        async function handleRegister() {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;

            if (!username || !password) {
                showError('Username & password wajib diisi');
                return;
            }

            if (password !== confirm) {
                showError('Password tidak cocok');
                return;
            }

            showLoading(true);
            hideMessages();

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('gaple_token', data.token);
                    localStorage.setItem('gaple_user', JSON.stringify(data.user));
                    showSuccess('Register berhasil! Mengalihkan...');
                    setTimeout(() => {
                        window.location.href = '/lobby.html';
                    }, 1000);
                } else {
                    showError(data.error || 'Register gagal');
                }
            } catch (err) {
                showError('Koneksi gagal. Coba lagi.');
            } finally {
                showLoading(false);
            }
        }

        // Check if already logged in
        (function checkAuth() {
            const token = localStorage.getItem('gaple_token');
            if (token) {
                window.location.href = '/lobby.html';
            }
        })();
    </script>
</body>
</html>
